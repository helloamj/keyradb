<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyraDB Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>
            <span>KEYRADB ENGINE VISUALIZER</span>
            <div class="header-actions">
                <button id="refresh-btn">Refresh</button>
                <button id="flush-btn" class="secondary">Force Flush</button>
            </div>
        </h2>
    </header>

    <div class="dashboard-layout">
        <!-- LEFT PANEL: Controls & Metrics -->
        <aside class="panel-left">
            <h3>SYSTEM METRICS</h3>
            <div class="metric">
                <span class="label">Active Memtable</span>
                <span class="value" id="mem-val">0 / 0 MB</span>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="mem-fill" style="width: 0%;"></div>
                </div>
            </div>
            <div class="metric">
                <span class="label">WAL Size</span>
                <span class="value" id="wal-size">0 KB</span>
            </div>
            <div class="metric">
                <span class="label">SSTables</span>
                <span class="value" id="sst-count">0</span>
            </div>

            <h3 style="margin-top: 30px;">QUERY CONSOLE</h3>
            <form id="query-form" class="metric">
                <label>Operation</label>
                <select id="op">
                    <option value="GET">GET</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
                
                <label style="margin-top: 10px;">Key</label>
                <input type="text" id="key" placeholder="e.g. user_1" required autocomplete="off">
                
                <div id="val-group" class="hidden">
                    <label style="margin-top: 10px;">Value</label>
                    <input type="text" id="value" placeholder="e.g. John Doe" autocomplete="off">
                </div>
                
                <button type="submit" style="margin-top: 15px; width: 100%;">Execute Query</button>
            </form>
            <div id="query-result" class="hidden"></div>
        </aside>

        <!-- RIGHT PANEL: Data Visualizations -->
        <main class="panel-right">
            <div class="data-section">
                <h3>MEMTABLES (IN-MEMORY)</h3>
                <div id="memtables-container" class="scrollable-container"></div>
            </div>
            
            <div class="data-section">
                <h3>SSTABLES (ON-DISK)</h3>
                <div id="sstables-container" class="scrollable-container"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
